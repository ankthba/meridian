name: Meridian
options:
  bundleIdPrefix: dev.meridian
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: H7T2D2GL7U
    CODE_SIGN_STYLE: Manual
    # One identity for every build, so the login keychain trusts them all
    # after a single "Always Allow" per stored key.
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ARCHS: arm64
packages:
  MeridianCore:
    path: Packages/MeridianCore
targets:
  Meridian:
    type: application
    platform: macOS
    sources:
      - path: Meridian
        excludes: ["Resources/Fonts/**", "Resources/ThirdPartyNotices.txt"]
      # Licenses of the bundled Rust crates and C/C++ libraries, generated by
      # scripts/third-party-notices.sh; Settings → About → Acknowledgements.
      - path: Meridian/Resources/ThirdPartyNotices.txt
        buildPhase: resources
    dependencies:
      - package: MeridianCore
    info:
      path: Meridian/Info.plist
      properties:
        CFBundleDisplayName: Meridian
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "3"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.finance
        NSHumanReadableCopyright: "Personal use. Market data per provider terms."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.meridian.Meridian
        PRODUCT_NAME: Meridian
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: Meridian/Meridian.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Releases are notarized (scripts/release.sh): secure timestamp and
        # no debugging entitlement (the notary service rejects get-task-allow).
        Release:
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  MeridianTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MeridianTests]
    dependencies:
      - target: Meridian
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Meridian.app/Contents/MacOS/Meridian"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Meridian:
    build:
      targets:
        Meridian: all
        MeridianTests: [test]
    test:
      targets: [MeridianTests]
      # The host app must not touch the user's data directory or the network.
      environmentVariables:
        MERIDIAN_MODE: mock
        MERIDIAN_IN_MEMORY: "1"
        MERIDIAN_MOCK_RATE: "0"
    run:
      config: Debug
